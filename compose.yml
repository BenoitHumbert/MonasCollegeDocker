services:
  caddy:
    image: caddy:2.10.0
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - monascollege_network
    environment:
      - CADDY_LISTEN=0.0.0.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3
  database:
    image: postgis/postgis:13-master
    restart: always
    # Required when running on platform other than amd64, like Apple M1/M2:
    # platform: linux/amd64
    volumes:
      - ./data/database:/var/lib/postgresql/data
    networks:
      - monascollege_network
    environment:
      POSTGRES_USER: 'directus'
      POSTGRES_PASSWORD_FILE: '/run/secrets/database_password'
      POSTGRES_DB: 'directus'
    healthcheck:
      test: [ "CMD", "pg_isready", "--host=localhost", "--username=directus" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    secrets:
      - database_password

  cron-purger:
    build:
      context: .
      dockerfile: dockerfile_cron
    restart: always
    volumes:
      - ./scripts/purge_directus_activity_secure.sh:/usr/local/bin/purge_directus_activity_secure.sh
      - ./scripts/cronjob:/etc/cronjob
      - ./secrets/database_password.txt:/run/secrets/database_password:ro
    networks:
      - monascollege_network
    depends_on:
      - database

  directus:
    image: directus/directus:11.6.1
    restart: always
    ports:
      - 8055:8055
    volumes:
      # - ./uploads:/directus/uploads
      - directus_uploads:/directus/uploads
    extra_hosts:
      - "mail.your-server.de:78.46.5.205"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - monascollege_network

    environment:
      PUBLIC_URL: 'https://monascollegeapp.bhdev.org'
      KEY: '255d861b-5ea1-5996-9aa3-922530ec40b1'
      SECRET_FILE: '/run/secrets/directus_secret'
      LOG_LEVEL: 'error'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'https://monascollege.bhdev.org,https://unsubscribemonascollege.bhdev.org,https://monascollegeresetpassword.bhdev.org'
      # CORS_ORIGIN: '*'
      WEBSOCKETS_ENABLED: 'true'

      EMAIL_TRANSPORT: 'smtp'
      EMAIL_FROM: 'no-reply-college@bhdev.org'
      EMAIL_SMTP_HOST: 'mail.your-server.de'
      EMAIL_SMTP_PORT: '587'
      EMAIL_SMTP_USER: 'no-reply-college@bhdev.org'
      EMAIL_SMTP_PASSWORD_FILE: '/run/secrets/email_smtp_password'
      PASSWORD_RESET_URL_ALLOW_LIST: 'https://monascollegeresetpassword.bhdev.org'

      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD_FILE: '/run/secrets/database_password'

      ADMIN_EMAIL: 'humbert.dev@gmail.com'
      ADMIN_PASSWORD_FILE: '/run/secrets/directus_admin_password'
      # Make sure to set this in production 
      # (see https://docs.directus.io/self-hosted/config-options#general)
      # PUBLIC_URL: 'https://directus.example.com'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"  

    secrets:
      - database_password
      - directus_secret
      - directus_admin_password
      - email_smtp_password
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:8055/server/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  directus_uploads:

networks:
  monascollege_network:
    driver: bridge

secrets:
  database_password:
    file: ./secrets/database_password.txt
  directus_secret:
    file: ./secrets/directus_secret.txt
  directus_admin_password:
    file: ./secrets/directus_admin_password.txt
  email_smtp_password:
    file: ./secrets/email_smtp_password.txt
